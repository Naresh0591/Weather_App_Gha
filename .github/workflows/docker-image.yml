name: Kubernetes CI
on: 
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nareshtu/gha-pyapp:${{ env.SHORT_SHA }}

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: nareshtu/gha-pyapp:${{ env.SHORT_SHA }}
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Send Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":rocket: *GitHub Actions Notification*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|View Commit>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: nareshtu/gha-pyapp:${{ env.SHORT_SHA }}

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update deployment.yml with latest docker tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          yq -i '.spec.template.spec.containers[0].image = "nareshtu/gha-pyapp:'"$SHORT_SHA"'"' ./k8s/pyapp-deployment.yml

      - name: Commit deployment file changes
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions@noreply"
            git add k8s/pyapp-deployment.yml
            git commit -m "docker tag updated by GHA [skip ci]" || echo "Already commited changes"
            git push origin main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig for EKS cluster
        run: aws eks update-kubeconfig --name wetherapp-cluster --region us-east-1

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/pyapp-deployment.yml
          kubectl apply -f k8s/pyapp-svc.yaml

      - name: Verify rollout
        run: kubectl rollout status deployment/pyapp --timeout=120s

      - name: Get Service URL
        run: kubectl get svc pyapp-svc -o wide
